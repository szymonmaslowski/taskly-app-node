name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend, agent]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: workspace
        working-directory: .
        run: |
          if [ -f "${{ matrix.workspace }}/package-lock.json" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.workspace.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - if: steps.workspace.outputs.present == 'true'
        run: npm ci
      - if: steps.workspace.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.workspace.outputs.present == 'true' && matrix.workspace == 'frontend'
        run: npm run format:check
      - if: steps.workspace.outputs.present == 'true'
        run: npm test
